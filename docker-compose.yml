services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: learning-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-learning_pwa}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss in .env gesetzt sein}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Kein veröffentlichter Port: Postgres ist nur im learning_network
    # erreichbar. Für Admin-Zugriff: `docker compose exec postgres psql ...`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - learning_network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Build-Kennung = Commit (docs/DEPLOY-UPDATE.md); leer fällt next.config.ts auf einen Zeitstempel zurück.
        NEXT_DEPLOYMENT_ID: ${NEXT_DEPLOYMENT_ID:-}
    # Genau eine App-Instanz (siehe DOCKER_DEPLOYMENT.md, "Exactly one app instance"): Rate-Limits und Job-Tracking liegen im
    # Speicher des Prozesses. Der feste container_name verhindert `docker compose up --scale app=2`; bitte nicht entfernen.
    container_name: learning-app
    restart: always
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD muss in .env gesetzt sein}@postgres:5432/${DB_NAME:-learning_pwa}
      # Pool und Zeitlimits (lib/server/db/client.ts); leer = Standard (10 Verbindungen, Abfragen höchstens 60 s)
      DB_POOL_MAX: ${DB_POOL_MAX:-}
      DB_STATEMENT_TIMEOUT_MS: ${DB_STATEMENT_TIMEOUT_MS:-}
      DB_IDLE_IN_TRANSACTION_TIMEOUT_MS: ${DB_IDLE_IN_TRANSACTION_TIMEOUT_MS:-}
      
      # Auth (Auth.js v5 reads AUTH_SECRET, see lib/server/auth.ts)
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET muss in .env gesetzt sein}

      # Comma-separated allowlist gating /api/register (see app/api/register/route.ts)
      REGISTRATION_ALLOWED_EMAILS: ${REGISTRATION_ALLOWED_EMAILS:-}

      # Google Gemini API
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-4-hydrogen}
      # lib/gemini.ts liest diese beiden zusätzlich (CURRICULUM_MODEL und
      # LESSONS_MODEL fallen beide auf GEMINI_MODEL zurück, wenn nicht
      # gesetzt) - ohne Weiterleitung hier lässt sich das Lessons-Modell
      # nicht unabhängig testen, nur per .env zu setzen reicht nicht.
      GEMINI_CURRICULUM_MODEL: ${GEMINI_CURRICULUM_MODEL:-}
      GEMINI_LESSONS_MODEL: ${GEMINI_LESSONS_MODEL:-}
      # Eigene Modelle für die Folgeschritte (leer = wie das Lektionsmodell): Tagging/Voraussetzungen, Übersetzung.
      GEMINI_TAGGING_MODEL: ${GEMINI_TAGGING_MODEL:-}
      GEMINI_TRANSLATION_MODEL: ${GEMINI_TRANSLATION_MODEL:-}
      # Übersetzung fertiger Kurse nach jeder Veröffentlichung (0 = aus).
      COURSE_AUTO_TRANSLATE: ${COURSE_AUTO_TRANSLATE:-}
      COURSE_TRANSLATION_DO_NOT_TRANSLATE: ${COURSE_TRANSLATION_DO_NOT_TRANSLATE:-}
      # Denkstufen je Schritt (low|medium|high|xhigh, leer = Vorgabe: Curriculum/Lektionen/Audit high, Übersetzung/Tagging low).
      GEMINI_THINKING_CURRICULUM: ${GEMINI_THINKING_CURRICULUM:-}
      GEMINI_THINKING_LESSONS: ${GEMINI_THINKING_LESSONS:-}
      GEMINI_THINKING_AUDIT: ${GEMINI_THINKING_AUDIT:-}
      GEMINI_THINKING_TRANSLATION: ${GEMINI_THINKING_TRANSLATION:-}
      GEMINI_THINKING_TAGGING: ${GEMINI_THINKING_TAGGING:-}
      # Kursgenerierung (docs/roadmaps/token-architektur.md): Quellenpaket oder Auszüge, Parallelität, Audit, Länge.
      COURSE_GEN_CONTEXT_MODE: ${COURSE_GEN_CONTEXT_MODE:-}
      COURSE_GEN_FULL_CONTEXT_MAX_CHARS: ${COURSE_GEN_FULL_CONTEXT_MAX_CHARS:-}
      COURSE_GEN_CONCURRENCY: ${COURSE_GEN_CONCURRENCY:-}
      COURSE_GEN_AUDIT: ${COURSE_GEN_AUDIT:-}
      COURSE_GEN_SECTION_WORDS: ${COURSE_GEN_SECTION_WORDS:-}
      # Batch-Modus (1 = an): Konzept-Tagging über die Gemini Batch API (halber Preis, Antwort später). Siehe lib/ai/batch.ts.
      GEMINI_BATCH: ${GEMINI_BATCH:-}
      GEMINI_BATCH_PRICE_FACTOR: ${GEMINI_BATCH_PRICE_FACTOR:-}
      GEMINI_BATCH_POLL_MS: ${GEMINI_BATCH_POLL_MS:-}

      # KI-Kosten: Preise pro 1 Mio. Token in USD und globales Budget
      # (lib/server/admin/ai-cost.ts). Leer = keine Schätzung/kein Limit.
      GEMINI_PRICE_PER_MILLION_PROMPT_TOKENS_USD: ${GEMINI_PRICE_PER_MILLION_PROMPT_TOKENS_USD:-}
      GEMINI_PRICE_PER_MILLION_COMPLETION_TOKENS_USD: ${GEMINI_PRICE_PER_MILLION_COMPLETION_TOKENS_USD:-}
      GEMINI_CURRICULUM_PRICE_PER_MILLION_PROMPT_TOKENS_USD: ${GEMINI_CURRICULUM_PRICE_PER_MILLION_PROMPT_TOKENS_USD:-}
      GEMINI_CURRICULUM_PRICE_PER_MILLION_COMPLETION_TOKENS_USD: ${GEMINI_CURRICULUM_PRICE_PER_MILLION_COMPLETION_TOKENS_USD:-}
      GEMINI_LESSONS_PRICE_PER_MILLION_PROMPT_TOKENS_USD: ${GEMINI_LESSONS_PRICE_PER_MILLION_PROMPT_TOKENS_USD:-}
      GEMINI_LESSONS_PRICE_PER_MILLION_COMPLETION_TOKENS_USD: ${GEMINI_LESSONS_PRICE_PER_MILLION_COMPLETION_TOKENS_USD:-}
      GEMINI_TAGGING_PRICE_PER_MILLION_PROMPT_TOKENS_USD: ${GEMINI_TAGGING_PRICE_PER_MILLION_PROMPT_TOKENS_USD:-}
      GEMINI_TAGGING_PRICE_PER_MILLION_COMPLETION_TOKENS_USD: ${GEMINI_TAGGING_PRICE_PER_MILLION_COMPLETION_TOKENS_USD:-}
      GEMINI_TRANSLATION_PRICE_PER_MILLION_PROMPT_TOKENS_USD: ${GEMINI_TRANSLATION_PRICE_PER_MILLION_PROMPT_TOKENS_USD:-}
      GEMINI_TRANSLATION_PRICE_PER_MILLION_COMPLETION_TOKENS_USD: ${GEMINI_TRANSLATION_PRICE_PER_MILLION_COMPLETION_TOKENS_USD:-}
      GEMINI_CACHED_PROMPT_PRICE_FACTOR: ${GEMINI_CACHED_PROMPT_PRICE_FACTOR:-}
      GEMINI_BUDGET_USD: ${GEMINI_BUDGET_USD:-}
      # Schaltet /api/monitor für scripts/monitor.sh ein (docs/MONITORING.md); leer = aus.
      MONITOR_TOKEN: ${MONITOR_TOKEN:-}

      # E-Mail-Versand per SMTP (docs/EMAIL.md); leer = Versand aus
      # Schlüssel zum Verschlüsseln gespeicherter Firmen-Geheimnisse (eigene KI-Schlüssel, BYOK): openssl rand -base64 32
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:-}
      MAIL_SMTP_HOST: ${MAIL_SMTP_HOST:-}
      MAIL_SMTP_PORT: ${MAIL_SMTP_PORT:-}
      MAIL_SMTP_SECURE: ${MAIL_SMTP_SECURE:-}
      MAIL_SMTP_USER: ${MAIL_SMTP_USER:-}
      MAIL_SMTP_PASSWORD: ${MAIL_SMTP_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      PUSH_ALLOWED_HOSTS: ${PUSH_ALLOWED_HOSTS:-}
      REVIEWER_QUALITY_FACTOR: ${REVIEWER_QUALITY_FACTOR:-}
      SECOND_REVIEW_SHARE: ${SECOND_REVIEW_SHARE:-}
      APP_BASE_URL: ${APP_BASE_URL:-}
      LEGAL_OPERATOR_NAME: ${LEGAL_OPERATOR_NAME:-}
      LEGAL_OPERATOR_ADDRESS: ${LEGAL_OPERATOR_ADDRESS:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-}
      LEGAL_PHONE: ${LEGAL_PHONE:-}
      LEGAL_REPRESENTATIVE: ${LEGAL_REPRESENTATIVE:-}
      LEGAL_REGISTER: ${LEGAL_REGISTER:-}
      LEGAL_VAT_ID: ${LEGAL_VAT_ID:-}
      LEGAL_PRIVACY_REVIEWED: ${LEGAL_PRIVACY_REVIEWED:-}
      LEGAL_TERMS_REVIEWED: ${LEGAL_TERMS_REVIEWED:-}
      LEGAL_AI_STATEMENT: ${LEGAL_AI_STATEMENT:-}
      SSO_ALLOW_PRIVATE_IDP: ${SSO_ALLOW_PRIVATE_IDP:-}

      # Uploaded certification source PDFs (R1.1, lib/server/storage/local-disk.ts)
      SOURCES_STORAGE_DIR: /app/data/sources

      # Node env
      NODE_ENV: production
    # Nur lokal gebunden: erreichbar über Caddy/Nginx auf dem Host
    # (deploy/Caddyfile -> 127.0.0.1:3000) oder über den Cloudflare Tunnel.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    # Migrationen vor jedem Start anwenden (idempotent); schlägt sie fehl,
    # startet die App nicht und der Healthcheck/Deploy meldet es.
    command: ["sh", "-c", "npm run db:migrate && exec npm start"]
    depends_on:
      postgres:
        condition: service_healthy
    # Kein Bind-Mount für ./public: er überdeckt das im Image gebaute public/ samt sw.js und swe-worker*.js
    # (stehen in .gitignore, entstehen erst im Build) - ohne sie gäbe es in Produktion keinen Service Worker.
    volumes:
      - source_uploads_data:/app/data/sources
    networks:
      - learning_network
    healthcheck:
      # busybox wget (kommt bereits mit node:alpine, kein zusätzliches Paket
      # nötig) statt curl - siehe app/api/health/route.ts.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Cloudflare Tunnel (exposes the app without a public port)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: learning-cloudflared
    restart: always
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      app:
        # Verhindert 502 Bad Gateway direkt nach dem Start: ohne
        # service_healthy leitet cloudflared bereits weiter, sobald der
        # app-Container GESTARTET ist, nicht sobald Next.js tatsächlich auf
        # Port 3000 lauscht (das dauert laut Log ca. 2s).
        condition: service_healthy
    networks:
      - learning_network

volumes:
  postgres_data:
    driver: local
  source_uploads_data:
    driver: local

networks:
  learning_network:
    driver: bridge
