services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: learning-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-learning_pwa}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD muss in .env gesetzt sein}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Kein veröffentlichter Port: Postgres ist nur im learning_network
    # erreichbar. Für Admin-Zugriff: `docker compose exec postgres psql ...`.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - learning_network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learning-app
    restart: always
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:?DB_PASSWORD muss in .env gesetzt sein}@postgres:5432/${DB_NAME:-learning_pwa}
      
      # Auth (Auth.js v5 reads AUTH_SECRET, see lib/server/auth.ts)
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET muss in .env gesetzt sein}

      # Comma-separated allowlist gating /api/register (see app/api/register/route.ts)
      REGISTRATION_ALLOWED_EMAILS: ${REGISTRATION_ALLOWED_EMAILS:-}

      # Google Gemini API
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      # lib/claude.ts liest diese beiden zusätzlich (CURRICULUM_MODEL und
      # LESSONS_MODEL fallen beide auf GEMINI_MODEL zurück, wenn nicht
      # gesetzt) - ohne Weiterleitung hier lässt sich das Lessons-Modell
      # nicht unabhängig testen, nur per .env zu setzen reicht nicht.
      GEMINI_CURRICULUM_MODEL: ${GEMINI_CURRICULUM_MODEL:-}
      GEMINI_LESSONS_MODEL: ${GEMINI_LESSONS_MODEL:-}

      # KI-Kosten: Preise pro 1 Mio. Token in USD und globales Budget
      # (lib/server/admin/content-generation.ts). Leer = keine Schätzung/kein Limit.
      GEMINI_CURRICULUM_PRICE_PER_MILLION_PROMPT_TOKENS_USD: ${GEMINI_CURRICULUM_PRICE_PER_MILLION_PROMPT_TOKENS_USD:-}
      GEMINI_CURRICULUM_PRICE_PER_MILLION_COMPLETION_TOKENS_USD: ${GEMINI_CURRICULUM_PRICE_PER_MILLION_COMPLETION_TOKENS_USD:-}
      GEMINI_LESSONS_PRICE_PER_MILLION_PROMPT_TOKENS_USD: ${GEMINI_LESSONS_PRICE_PER_MILLION_PROMPT_TOKENS_USD:-}
      GEMINI_LESSONS_PRICE_PER_MILLION_COMPLETION_TOKENS_USD: ${GEMINI_LESSONS_PRICE_PER_MILLION_COMPLETION_TOKENS_USD:-}
      GEMINI_BUDGET_USD: ${GEMINI_BUDGET_USD:-}

      # Uploaded certification source PDFs (R1.1, lib/server/storage/local-disk.ts)
      SOURCES_STORAGE_DIR: /app/data/sources

      # Node env
      NODE_ENV: production
    # Nur lokal gebunden: erreichbar über Caddy/Nginx auf dem Host
    # (deploy/Caddyfile -> 127.0.0.1:3000) oder über den Cloudflare Tunnel.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    # Migrationen vor jedem Start anwenden (idempotent); schlägt sie fehl,
    # startet die App nicht und der Healthcheck/Deploy meldet es.
    command: ["sh", "-c", "npm run db:migrate && exec npm start"]
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./public:/app/public
      - source_uploads_data:/app/data/sources
    networks:
      - learning_network
    healthcheck:
      # busybox wget (kommt bereits mit node:alpine, kein zusätzliches Paket
      # nötig) statt curl - siehe app/api/health/route.ts.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Cloudflare Tunnel (exposes the app without a public port)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: learning-cloudflared
    restart: always
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      app:
        # Verhindert 502 Bad Gateway direkt nach dem Start: ohne
        # service_healthy leitet cloudflared bereits weiter, sobald der
        # app-Container GESTARTET ist, nicht sobald Next.js tatsächlich auf
        # Port 3000 lauscht (das dauert laut Log ca. 2s).
        condition: service_healthy
    networks:
      - learning_network

volumes:
  postgres_data:
    driver: local
  source_uploads_data:
    driver: local

networks:
  learning_network:
    driver: bridge
