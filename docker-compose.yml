services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: learning-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-learning_pwa}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - learning_network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learning-app
    restart: always
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-learning_pwa}
      
      # Auth (Auth.js v5 reads AUTH_SECRET, see lib/server/auth.ts)
      AUTH_SECRET: ${AUTH_SECRET}

      # Comma-separated allowlist gating /api/register (see app/api/register/route.ts)
      REGISTRATION_ALLOWED_EMAILS: ${REGISTRATION_ALLOWED_EMAILS:-}

      # Anthropic Claude API
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MAX_ATTEMPTS: ${ANTHROPIC_MAX_ATTEMPTS:-5}
      ANTHROPIC_RETRY_BASE_MS: ${ANTHROPIC_RETRY_BASE_MS:-2000}
      CLAUDE_CURRICULUM_MODEL: ${CLAUDE_CURRICULUM_MODEL:-}
      CLAUDE_LESSONS_MODEL: ${CLAUDE_LESSONS_MODEL:-}
      ANTHROPIC_CURRICULUM_PRICE_PER_MILLION_PROMPT_TOKENS_USD: ${ANTHROPIC_CURRICULUM_PRICE_PER_MILLION_PROMPT_TOKENS_USD:-}
      ANTHROPIC_CURRICULUM_PRICE_PER_MILLION_COMPLETION_TOKENS_USD: ${ANTHROPIC_CURRICULUM_PRICE_PER_MILLION_COMPLETION_TOKENS_USD:-}
      ANTHROPIC_LESSONS_PRICE_PER_MILLION_PROMPT_TOKENS_USD: ${ANTHROPIC_LESSONS_PRICE_PER_MILLION_PROMPT_TOKENS_USD:-}
      ANTHROPIC_LESSONS_PRICE_PER_MILLION_COMPLETION_TOKENS_USD: ${ANTHROPIC_LESSONS_PRICE_PER_MILLION_COMPLETION_TOKENS_USD:-}
      ANTHROPIC_BUDGET_USD: ${ANTHROPIC_BUDGET_USD:-}

      # Uploaded certification source PDFs (R1.1, lib/server/storage/local-disk.ts)
      SOURCES_STORAGE_DIR: /app/data/sources

      # Node env
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./public:/app/public
      - source_uploads_data:/app/data/sources
    networks:
      - learning_network
    healthcheck:
      # busybox wget (kommt bereits mit node:alpine, kein zusätzliches Paket
      # nötig) statt curl - siehe app/api/health/route.ts.
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Cloudflare Tunnel (exposes the app without a public port)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: learning-cloudflared
    restart: always
    command: tunnel --no-autoupdate --protocol http2 run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      app:
        # Verhindert 502 Bad Gateway direkt nach dem Start: ohne
        # service_healthy leitet cloudflared bereits weiter, sobald der
        # app-Container GESTARTET ist, nicht sobald Next.js tatsächlich auf
        # Port 3000 lauscht (das dauert laut Log ca. 2s).
        condition: service_healthy
    networks:
      - learning_network

volumes:
  postgres_data:
    driver: local
  source_uploads_data:
    driver: local

networks:
  learning_network:
    driver: bridge
