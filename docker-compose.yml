services:
  # PostgreSQL Database
  postgres:
    image: postgres:17-alpine
    container_name: learning-postgres
    restart: always
    environment:
      POSTGRES_DB: ${DB_NAME:-learning_pwa}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - learning_network

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: learning-app
    restart: always
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@postgres:5432/${DB_NAME:-learning_pwa}
      
      # Auth (Auth.js v5 reads AUTH_SECRET, see lib/server/auth.ts)
      AUTH_SECRET: ${AUTH_SECRET}

      # Comma-separated allowlist gating /api/register (see app/api/register/route.ts)
      REGISTRATION_ALLOWED_EMAILS: ${REGISTRATION_ALLOWED_EMAILS:-}

      # Gemini API
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      
      # Node env
      NODE_ENV: production
    ports:
      - "${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./public:/app/public
    networks:
      - learning_network

  # Cloudflare Tunnel (exposes the app without a public port)
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: learning-cloudflared
    restart: always
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - app
    networks:
      - learning_network

volumes:
  postgres_data:
    driver: local

networks:
  learning_network:
    driver: bridge
