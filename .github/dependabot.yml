# Dependabot öffnet Pull Requests, wenn es neue Versionen oder Sicherheitsupdates gibt. Er ändert nichts von selbst:
# jeder Vorschlag läuft durch die CI (inklusive Audit) und wird erst nach einem Merge wirksam.
#
# Was Dependabot nicht kann: die Einträge unter "overrides" in package.json (zod, katex, postcss-selector-parser)
# aktualisieren. Sie halten Pakete auf gepatchten Versionen, die andere Pakete exakt pinnen. Wird ein Override
# überflüssig (das pinnende Paket zieht nach), fällt das beim Aktualisieren auf und er kann raus.

version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    ignore:
      # typescript-eslint unterstützt TypeScript 7 noch nicht: der Lint-Schritt bricht mit "typescript-eslint does not
      # support TS 7.0" ab (PR #172). Die Regel gilt für jeden Major-Sprung; sie kann raus, sobald typescript-eslint
      # die neue Version unterstützt und das Projekt sie bewusst übernimmt.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Das Binding 0.6 liefert 34 Gewichte (FSRS-7), das Projekt rechnet mit FSRS-6 und 21 Gewichten (ts-fsrs/models/fsrs-6,
      # Tabelle user_fsrs_params). Patch-Updates der 0.5er-Reihe laufen weiter. Der Umstieg auf FSRS-7 ist eine eigene
      # Entscheidung: andere Gewichte und Neuaufbau des Gedächtnisstands aus dem review_log.
      - dependency-name: "@open-spaced-repetition/binding"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      # Die Typen folgen der Node-Version der CI und des Dockerfiles; der Major-Sprung kommt mit ihr (siehe docker unten).
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # Beides ist in package.json exakt gepinnt und muss zusammen auf dieselbe Version.
      next:
        patterns: ["next", "eslint-config-next"]
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
      # Auth.js v5 läuft noch als Beta (exakt gepinnt, docs/roadmaps/ROADMAP.md). Jede neue Beta und vor allem das
      # Stable-Release kommen als eigener Vorschlag, nicht versteckt im Sammel-PR: Login, Sessions und Passwort-Reset von
      # Hand prüfen, bevor er gemergt wird (PWA-Roadmap AP-04, m-5).
      auth:
        patterns: ["next-auth", "@auth/*"]
      # Alles Übrige ohne Major-Sprung in einem Vorschlag pro Woche. Major-Updates kommen einzeln.
      minor-and-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: "docker"
    ignore:
      # Den Node-Major hebt man zusammen mit der CI (node-version) und der README an, nicht allein im Dockerfile.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker-compose
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: "docker"
    ignore:
      # Ein Major-Wechsel von Postgres braucht Dump und Restore, nie ein automatisches Image-Update.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
      # cloudflared steht bewusst auf "latest" (kein Versionsvergleich möglich), hier gibt es nichts vorzuschlagen.
