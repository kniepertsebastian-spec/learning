name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Echte Postgres-Datenbank für die Rechte-Tests des Firmenbereichs
    # (lib/server/company/company-access.test.ts) - gleiche Hauptversion wie docker-compose.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      # pdftotext für die PDF-Extraktions-Tests (Dockerfile installiert dasselbe Paket).
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      # Blockiert ab „hoch“ (Laufzeit-Abhängigkeiten). Ein neu veröffentlichter Fund macht die CI rot, bis er behoben
      # ist: Abhängigkeit aktualisieren oder, wenn es keine Korrektur gibt, in package.json unter "overrides" festnageln.
      # Moderate Funde im Build-Werkzeug (serwist) bleiben erlaubt.
      - name: Abhängigkeiten prüfen
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run lint:ui
      - run: npm run check:contrast
      # Wendet die komplette Migrationskette auf die leere Datenbank an (prüft sie nebenbei).
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/ci
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-only-secret
      # Nach dem Build: Next generiert dort die globalen Typen (z. B. LayoutProps).
      - run: npx tsc --noEmit
      # PWA-E2E gegen den Produktions-Build (Service Worker ist im Dev-Server abgeschaltet), siehe docs/PWA.md.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgres://postgres:ci@localhost:5432/ci
          AUTH_SECRET: ci-only-secret
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
      # Lighthouse (Best Practices) nur als Warnung: ein Wert unter der Schwelle bricht CI nicht ab.
      - name: Lighthouse (Warnung)
        continue-on-error: true
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/ci
          AUTH_SECRET: ci-only-secret
          AUTH_TRUST_HOST: "true"
        run: |
          node node_modules/next/dist/bin/next start -p 3100 &
          SERVER=$!
          for i in $(seq 1 30); do curl -sf http://localhost:3100/login >/dev/null && break; sleep 1; done
          CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" npm run lighthouse
          STATUS=$?
          kill $SERVER
          exit $STATUS
