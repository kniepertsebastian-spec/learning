name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    # Echte Postgres-Datenbank für die Rechte-Tests des Firmenbereichs
    # (lib/server/company/company-access.test.ts) - gleiche Hauptversion wie docker-compose.yml.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v7
      # node_modules gehört nicht in den Index (siehe .gitignore). Ein versehentlich eingechecktes Verzeichnis lässt Diffs
      # unlesbar werden und passt nicht zum Lockfile.
      - name: node_modules nicht im Index
        run: |
          if [ -n "$(git ls-files node_modules)" ]; then
            echo "::error::node_modules ist im Git-Index. Entfernen mit: git rm -r --cached node_modules"
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      # pdftotext für die PDF-Extraktions-Tests (Dockerfile installiert dasselbe Paket).
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      # Blockiert ab „hoch“ (Laufzeit-Abhängigkeiten). Ein neu veröffentlichter Fund macht die CI rot, bis er behoben
      # ist: Abhängigkeit aktualisieren oder, wenn es keine Korrektur gibt, in package.json unter "overrides" festnageln.
      # Moderate Funde im Build-Werkzeug (serwist) bleiben erlaubt.
      - name: Abhängigkeiten prüfen
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run lint:ui
      - run: npm run check:contrast
      # Wendet die komplette Migrationskette auf die leere Datenbank an (prüft sie nebenbei).
      - run: npm run db:migrate
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/ci
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgres://ci:ci@localhost:5432/ci
          AUTH_SECRET: ci-only-secret
      # Nach dem Build: Next generiert dort die globalen Typen (z. B. LayoutProps).
      - run: npx tsc --noEmit
      # PWA-E2E gegen den Produktions-Build (Service Worker ist im Dev-Server abgeschaltet), siehe docs/PWA.md.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
        env:
          E2E_DATABASE_URL: postgres://postgres:ci@localhost:5432/ci
          AUTH_SECRET: ci-only-secret
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          if-no-files-found: ignore
      # Lighthouse auf /login und /offline: Barrierefreiheit ist verbindlich (unter 90 wird CI rot), Performance und Best
      # Practices melden nur eine Warnung (Messwerte auf geteilten Runnern schwanken). Kein continue-on-error: Läuft
      # Lighthouse nicht oder fehlt eine Punktzahl, schlägt der Schritt ebenfalls fehl.
      - name: Lighthouse
        env:
          DATABASE_URL: postgres://postgres:ci@localhost:5432/ci
          AUTH_SECRET: ci-only-secret
          AUTH_TRUST_HOST: "true"
          LIGHTHOUSE_MIN_ACCESSIBILITY: "0.9"
          # Stufenweise angehoben (PWA-Roadmap m-2): erst Warnung ab 0.8, als harte Grenze erst, wenn die Werte stabil darüber liegen.
          LIGHTHOUSE_WARN_PERFORMANCE: "0.8"
          LIGHTHOUSE_WARN_BEST_PRACTICES: "0.9"
        run: |
          node node_modules/next/dist/bin/next start -p 3100 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          for i in $(seq 1 30); do curl -sf http://localhost:3100/login >/dev/null && break; sleep 1; done
          curl -sf http://localhost:3100/login >/dev/null || { echo "::error::Server auf Port 3100 nicht erreichbar"; exit 1; }
          CHROME_PATH="$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" npm run lighthouse -- http://localhost:3100 /login /offline
