# Zabbix-Agent-Konfiguration für die Lernplattform. Ablegen als
# /etc/zabbix/zabbix_agent2.d/learning.conf (bzw. zabbix_agentd.d/), Pfad /opt/learning anpassen.
# Anleitung, Items und Trigger: docs/MONITORING.md
#
# Die Items liefern den HTTP-Statuscode (200 = gut, 503 = Datenbank nicht erreichbar, 000 = App nicht erreichbar).
UserParameter=learning.app.health,curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/health
UserParameter=learning.app.ready,curl -s -m 5 -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/ready
UserParameter=learning.backup.age,/opt/learning/scripts/monitor-backup.sh
